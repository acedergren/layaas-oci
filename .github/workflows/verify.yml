name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Install pinned runtime and test tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements-linux.lock
          python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run contract, secret-adapter, and stack-safety tests
        run: python -m pytest -q
      - name: Compile Python and check shell syntax
        run: |
          python -m compileall -q server.py release.py deploy examples scripts tests
          bash -n deploy/bootstrap.sh
      - name: Check Terraform formatting and validity
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Check stack package
        run: python scripts/package_stack.py /tmp/layaas-oci-stack.zip
      - name: Check YAML and patch whitespace
        run: |
          ruby -e 'require "yaml"; YAML.load_file("schema.yaml"); YAML.load_file(".github/ISSUE_TEMPLATE/bug_report.yml")'
          git diff --check

  release-stack:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Resource Manager package
        run: python scripts/package_stack.py dist/layaas-oci-stack.zip
      - name: Attach stack zip to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/layaas-oci-stack.zip --generate-notes
