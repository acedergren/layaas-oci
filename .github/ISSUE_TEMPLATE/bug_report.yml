name: Bug report
description: Report a reproducible issue in the public API or OCI stack.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Use synthetic input only. Never include credentials, private addresses,
        OCIDs, production evidence or customer data. Report security issues privately.
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Terraform stack, API, client or docs
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized status/error text only.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic data and redact all credentials/resource IDs.
    validations:
      required: true
